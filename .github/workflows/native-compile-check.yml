name: Native Compile Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  native-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'graalvm'
          java-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build GraalVM native image (dev)
        run: |
          ./gradlew nativeCompile -PserverBuildProfile=dev
          mv server/build/native/nativeCompile/shorturl-dev* server/build/native/nativeCompile/shorturl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: shorturl-test:pr

      - name: Test admin endpoint
        uses: ./.github/actions/test-docker-image
        with:
          image-tag: shorturl-test:pr
